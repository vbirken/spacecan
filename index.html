<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sky Dodger</title>
    <style>
      :root {
        color-scheme: dark;
        --ink: #f8fbff;
        --muted: #b5c5d9;
        --panel: rgba(11, 18, 30, 0.72);
        --accent: #f2c14e;
        --danger: #ff6b6b;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        margin: 0;
      }

      body {
        display: grid;
        place-items: center;
        overflow: hidden;
        background:
          radial-gradient(circle at 30% 20%, rgba(93, 176, 255, 0.26), transparent 28rem),
          linear-gradient(180deg, #07111f 0%, #0b223d 48%, #102f3d 100%);
        color: var(--ink);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .shell {
        width: min(100vw, 980px);
        height: min(100vh, 680px);
        position: relative;
        display: grid;
        place-items: center;
        padding: 16px;
      }

      canvas {
        width: 100%;
        height: 100%;
        max-height: 648px;
        display: block;
        border: 1px solid rgba(255, 255, 255, 0.18);
        background: #0a1f36;
        box-shadow: 0 22px 70px rgba(0, 0, 0, 0.36);
      }

      .hud {
        position: absolute;
        top: 28px;
        left: 28px;
        right: 28px;
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 12px;
        pointer-events: none;
      }

      .score {
        min-width: 88px;
        padding: 9px 12px;
        border: 1px solid rgba(255, 255, 255, 0.18);
        background: var(--panel);
        font-size: clamp(18px, 3vw, 26px);
        font-weight: 800;
        line-height: 1;
        text-align: center;
        backdrop-filter: blur(12px);
      }

      .hint {
        max-width: min(52vw, 360px);
        padding: 9px 12px;
        border: 1px solid rgba(255, 255, 255, 0.16);
        background: var(--panel);
        color: var(--muted);
        font-size: clamp(12px, 2vw, 15px);
        line-height: 1.35;
        text-align: right;
        backdrop-filter: blur(12px);
      }

      .message {
        position: absolute;
        inset: auto 28px 32px;
        display: grid;
        gap: 8px;
        justify-items: center;
        padding: 16px;
        border: 1px solid rgba(255, 255, 255, 0.18);
        background: var(--panel);
        text-align: center;
        backdrop-filter: blur(14px);
      }

      .message strong {
        font-size: clamp(20px, 4vw, 34px);
        line-height: 1;
      }

      .message span {
        color: var(--muted);
        font-size: clamp(13px, 2vw, 16px);
      }

      .hidden {
        display: none;
      }

      @media (max-width: 620px) {
        .shell {
          padding: 0;
          height: 100vh;
        }

        canvas {
          max-height: none;
          border: 0;
        }

        .hud {
          top: 14px;
          left: 14px;
          right: 14px;
        }

        .message {
          inset: auto 14px 18px;
        }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <canvas id="game" aria-label="Side-scrolling pillar dodging game"></canvas>
      <div class="hud">
        <div class="score" id="score">0</div>
        <div class="score" id="health">0</div>
  
        <div class="hint">Space / tap to climb</div>
      </div>
      <div class="message" id="message">
        <strong>Sky Dodger</strong>
        <span>Press space to start, climb, and slip through the pillars.</span>
      </div>
    </main>

    <script>
      const canvas = document.querySelector("#game");
      const ctx = canvas.getContext("2d");
      const scoreEl = document.querySelector("#score");
      const healthEl = document.querySelector("#health");
      const messageEl = document.querySelector("#message");
      const shipSprites = ["player-1.png", "player-2.png", "player-3.png"].map((src) => {
        const image = new Image();
        image.src = src;
        return image;
      });
      const pillarBodyImage = new Image();
      const pillarCapImage = new Image();
      pillarBodyImage.src = "pillar-body.png";
      pillarCapImage.src = "pillar-cap.png";
      const cloudImage = new Image();
      const skyBackgroundImage = new Image();
      const starImage = new Image();
      const healthPowerupImage = new Image();
      const shieldPowerupImage = new Image();
      const groundTileImage = new Image();
      cloudImage.src = "cloud.png";
      skyBackgroundImage.src = "sky-background.png";
      starImage.src = "star.png";
      healthPowerupImage.src = "powerup-health.png";
      shieldPowerupImage.src = "powerup-shield.png";
      groundTileImage.src = "ground-tile.png";

      const game = {
        width: 0,
        height: 0,
        state: "ready",
        score: 0,
        health: 3,
        invincibleTimer: 0,
        best: Number(localStorage.getItem("skyDodgerBest") || 0),
        speed: 220,
        spawnTimer: 0,
        powerupTimer: 3.2,
        groundHeight: 54,
        clouds: [],
        stars: [],
        pillars: [],
        powerups: [],
        ship: {
          x: 0,
          y: 0,
          radius: 18,
          velocity: 0,
          rotation: 0
        }
      };

      const gravity = 1250;
      const lift = -390;
      const pillarWidth = 78;
      const pillarGap = 178;
      const pillarSpacing = 1.45;

      function resize() {
        const shell = canvas.parentElement.getBoundingClientRect();
        const dpr = Math.max(1, Math.min(window.devicePixelRatio || 1, 2));
        canvas.width = Math.floor(shell.width * dpr);
        canvas.height = Math.floor(shell.height * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        game.width = shell.width;
        game.height = shell.height;
        game.ship.x = Math.max(95, game.width * 0.22);
        if (game.state === "ready") {
          reset(false);
        }
        makeBackdrop();
      }

      function makeBackdrop() {
        game.clouds = Array.from({ length: 7 }, (_, i) => ({
          x: (i / 7) * game.width + Math.random() * 90,
          y: 62 + Math.random() * (game.height * 0.42),
          scale: 0.75 + Math.random() * 1.3,
          speed: 12 + Math.random() * 22
        }));

        game.stars = Array.from({ length: 70 }, () => ({
          x: Math.random() * game.width,
          y: Math.random() * game.height * 0.72,
          alpha: 0.25 + Math.random() * 0.65
        }));
      }

      function reset(showMessage = true) {
        game.state = "ready";
        game.score = 0;
        game.health = 3;
        game.invincibleTimer = 0;
        game.speed = 220;
        game.spawnTimer = 0;
        game.powerupTimer = 3.2;
        game.pillars = [];
        game.powerups = [];
        game.ship.y = game.height * 0.42;
        game.ship.velocity = 0;
        game.ship.rotation = 0;
        scoreEl.textContent = "0";
        healthEl.textContent = String(game.health);
        if (showMessage) {
          messageEl.classList.remove("hidden");
          messageEl.querySelector("strong").textContent = "Sky Dodger";
          messageEl.querySelector("span").textContent = "Press space to start, climb, and slip through the pillars.";
        }
      }

      function start() {
        game.state = "playing";
        messageEl.classList.add("hidden");
        game.ship.velocity = lift;
      }

      function climb() {
        if (game.state === "ready") {
          start();
          return;
        }

        if (game.state === "over") {
          reset();
          return;
        }

        game.ship.velocity = lift;
      }

      function spawnPillar() {
        const margin = 78;
        const minTop = margin;
        const maxTop = game.height - game.groundHeight - margin - pillarGap;
        const gapTop = minTop + Math.random() * Math.max(1, maxTop - minTop);
        game.pillars.push({
          x: game.width + pillarWidth,
          gapTop,
          passed: false,
          hit: false
        });
      }

      function spawnPowerup() {
        const radius = 16;
        game.powerups.push({
          x: game.width + radius,
          y: 85 + Math.random() * Math.max(1, game.height - game.groundHeight - 170),
          radius,
          type: Math.random() < 0.55 ? "health" : "shield"
        });
      }

      function endGame() {
        if (game.state !== "playing") return;
        game.state = "over";
        game.best = Math.max(game.best, game.score);
        localStorage.setItem("skyDodgerBest", String(game.best));
        messageEl.classList.remove("hidden");
        messageEl.querySelector("strong").textContent = "Game over";
        messageEl.querySelector("span").textContent = `Score ${game.score} · Best ${game.best} · Press space to restart.`;
      }

      function update(delta) {
        for (const cloud of game.clouds) {
          cloud.x -= cloud.speed * delta;
          if (cloud.x < -150 * cloud.scale) {
            cloud.x = game.width + 120;
            cloud.y = 62 + Math.random() * (game.height * 0.42);
          }
        }

        if (game.state !== "playing") return;

        game.ship.velocity += gravity * delta;
        game.ship.y += game.ship.velocity * delta;
        game.ship.rotation = Math.max(-0.65, Math.min(1.1, game.ship.velocity / 480));
        game.speed += delta * 3.5;
        game.spawnTimer -= delta;
        game.powerupTimer -= delta;
        game.invincibleTimer = Math.max(0, game.invincibleTimer - delta);

        if (game.spawnTimer <= 0) {
          spawnPillar();
          game.spawnTimer = pillarSpacing;
        }

        if (game.powerupTimer <= 0) {
          spawnPowerup();
          game.powerupTimer = 4 + Math.random() * 2.5;
        }

        for (const pillar of game.pillars) {
          pillar.x -= game.speed * delta;
          if (!pillar.passed && pillar.x + pillarWidth < game.ship.x) {
            pillar.passed = true;
            game.score += 1;
            scoreEl.textContent = String(game.score);
          }
        }

        for (const powerup of game.powerups) {
          powerup.x -= game.speed * delta;
        }

        healthEl.textContent = String(game.health);

        game.pillars = game.pillars.filter((pillar) => pillar.x > -pillarWidth - 20);
        game.powerups = game.powerups.filter((powerup) => powerup.x > -powerup.radius - 20);
        checkPowerups();
        checkCollisions();
      }

      function checkPowerups() {
        for (const powerup of game.powerups) {
          const dx = game.ship.x - powerup.x;
          const dy = game.ship.y - powerup.y;
          const touching = Math.hypot(dx, dy) < game.ship.radius + powerup.radius;

          if (touching) {
            applyPowerup(powerup);
            powerup.collected = true;
          }
        }

        game.powerups = game.powerups.filter((powerup) => !powerup.collected);
      }

      function applyPowerup(powerup) {
        if (powerup.type === "health") {
          game.health = Math.min(game.health + 1, 5);
          healthEl.textContent = String(game.health);
        }

        if (powerup.type === "shield") {
          game.invincibleTimer = 5;
        }
      }

      function checkCollisions() {
        const ship = game.ship;
        const floor = game.height - game.groundHeight;
        if (ship.y - ship.radius < 0 || ship.y + ship.radius > floor) {
          endGame();
          return;
        }

        for (const pillar of game.pillars) {
          const nearX = ship.x + ship.radius > pillar.x && ship.x - ship.radius < pillar.x + pillarWidth;
          const inGap = ship.y - ship.radius > pillar.gapTop && ship.y + ship.radius < pillar.gapTop + pillarGap;
          if (nearX && !inGap && !pillar.hit && game.invincibleTimer <= 0) {
            pillar.hit = true;
            game.health = game.health - 1;
            healthEl.textContent = String(game.health);
            if (game.health === 0) {
              endGame();
            }
            return;
          }
        }
      }

      function draw() {
        ctx.clearRect(0, 0, game.width, game.height);
        drawSky();
        drawPillars();
        drawPowerups();
        drawGround();
        drawShip();
      }

      function drawSky() {
        if (skyBackgroundImage.complete) {
          ctx.drawImage(skyBackgroundImage, 0, 0, game.width, game.height);
        } else {
          const gradient = ctx.createLinearGradient(0, 0, 0, game.height);
          gradient.addColorStop(0, "#071a32");
          gradient.addColorStop(0.56, "#14506f");
          gradient.addColorStop(1, "#153d42");
          ctx.fillStyle = gradient;
          ctx.fillRect(0, 0, game.width, game.height);
        }

        for (const star of game.stars) {
          ctx.globalAlpha = star.alpha;
          if (starImage.complete) {
            ctx.drawImage(starImage, star.x - 3, star.y - 3, 8, 8);
          } else {
            ctx.fillStyle = "#fff4bf";
            ctx.fillRect(star.x, star.y, 2, 2);
          }
          ctx.globalAlpha = 1;
        }

        for (const cloud of game.clouds) {
          ctx.save();
          ctx.translate(cloud.x, cloud.y);
          ctx.scale(cloud.scale, cloud.scale);
          if (cloudImage.complete) {
            ctx.drawImage(cloudImage, -55, -8, 150, 58);
          } else {
            ctx.fillStyle = "rgba(222, 242, 255, 0.18)";
            ctx.beginPath();
            ctx.ellipse(0, 18, 42, 16, 0, 0, Math.PI * 2);
            ctx.ellipse(34, 14, 34, 14, 0, 0, Math.PI * 2);
            ctx.ellipse(-31, 17, 29, 13, 0, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.restore();
        }
      }

      function drawPillars() {
        for (const pillar of game.pillars) {
          drawPillarSegment(pillar.x, 0, pillarWidth, pillar.gapTop, true);
          const lowerY = pillar.gapTop + pillarGap;
          drawPillarSegment(pillar.x, lowerY, pillarWidth, game.height - game.groundHeight - lowerY, false);
        }
      }

      function drawPillarSegment(x, y, width, height, capBottom) {
        const capHeight = 22;
        const capY = capBottom ? y + height - capHeight : y;

        if (pillarBodyImage.complete && pillarCapImage.complete) {
          ctx.drawImage(pillarBodyImage, x, y, width, height);
          ctx.drawImage(pillarCapImage, x - 8, capY, width + 16, capHeight);
          return;
        }

        const grad = ctx.createLinearGradient(x, 0, x + width, 0);
        grad.addColorStop(0, "#1f8f79");
        grad.addColorStop(0.5, "#48c497");
        grad.addColorStop(1, "#126756");
        ctx.fillStyle = grad;
        ctx.fillRect(x, y, width, height);

        ctx.fillStyle = "rgba(255, 255, 255, 0.17)";
        ctx.fillRect(x + 11, y, 10, height);
        ctx.fillStyle = "rgba(0, 0, 0, 0.18)";
        ctx.fillRect(x + width - 16, y, 8, height);

        ctx.fillStyle = "#5ad0a1";
        ctx.fillRect(x - 8, capY, width + 16, capHeight);
        ctx.fillStyle = "rgba(0, 0, 0, 0.16)";
        ctx.fillRect(x - 8, capY + 17, width + 16, 5);
      }

      function drawPowerups() {
        const pulse = 1 + Math.sin(performance.now() / 160) * 0.08;

        for (const powerup of game.powerups) {
          ctx.save();
          ctx.translate(powerup.x, powerup.y);
          ctx.scale(pulse, pulse);

          const image = powerup.type === "health" ? healthPowerupImage : shieldPowerupImage;
          if (image.complete) {
            ctx.drawImage(image, -powerup.radius - 8, -powerup.radius - 8, (powerup.radius + 8) * 2, (powerup.radius + 8) * 2);
          } else if (powerup.type === "health") {
            ctx.fillStyle = "#ff5c7a";
            ctx.beginPath();
            ctx.arc(0, 0, powerup.radius, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = "#ffffff";
            ctx.fillRect(-4, -10, 8, 20);
            ctx.fillRect(-10, -4, 20, 8);
          }

          if (!image.complete && powerup.type === "shield") {
            ctx.fillStyle = "rgba(117, 215, 255, 0.22)";
            ctx.beginPath();
            ctx.arc(0, 0, powerup.radius + 3, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = "#75d7ff";
            ctx.lineWidth = 5;
            ctx.beginPath();
            ctx.arc(0, 0, powerup.radius, 0, Math.PI * 2);
            ctx.stroke();

            ctx.fillStyle = "#d9f7ff";
            ctx.beginPath();
            ctx.arc(0, 0, 4, 0, Math.PI * 2);
            ctx.fill();
          }

          ctx.restore();
        }
      }

      function drawGround() {
        const y = game.height - game.groundHeight;
        if (groundTileImage.complete) {
          const offset = (performance.now() / 18) % 96;
          for (let x = -96 - offset; x < game.width + 96; x += 96) {
            ctx.drawImage(groundTileImage, x, y, 96, game.groundHeight);
          }
        } else {
          ctx.fillStyle = "#163326";
          ctx.fillRect(0, y, game.width, game.groundHeight);
          ctx.fillStyle = "#2f9b70";
          ctx.fillRect(0, y, game.width, 9);
          ctx.fillStyle = "rgba(255, 255, 255, 0.14)";
          for (let x = -40; x < game.width + 80; x += 48) {
            ctx.fillRect((x - (performance.now() / 18) % 48), y + 18, 24, 3);
          }
        }
      }

      function drawShip() {
        const { x, y, radius, rotation } = game.ship;
        const frame = Math.floor(performance.now() / 120) % shipSprites.length;
        const sprite = shipSprites[frame];
        const spriteWidth = radius * 3.7;
        const spriteHeight = radius * 2.55;
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(rotation);

        if (game.invincibleTimer > 0) {
          ctx.strokeStyle = "rgba(117, 215, 255, 0.86)";
          ctx.lineWidth = 4;
          ctx.beginPath();
          ctx.arc(0, 0, radius + 12, 0, Math.PI * 2);
          ctx.stroke();
        }

        ctx.fillStyle = "rgba(0, 0, 0, 0.24)";
        ctx.beginPath();
        ctx.ellipse(2, 22, 21, 7, 0, 0, Math.PI * 2);
        ctx.fill();

        if (sprite.complete) {
          ctx.drawImage(sprite, -spriteWidth / 2, -spriteHeight / 2, spriteWidth, spriteHeight);
        }

        ctx.restore();
      }

      let previous = performance.now();
      function loop(now) {
        const delta = Math.min(0.033, (now - previous) / 1000);
        previous = now;
        update(delta);
        draw();
        requestAnimationFrame(loop);
      }

      window.addEventListener("resize", resize);
      window.addEventListener("keydown", (event) => {
        if (event.code === "Space") {
          event.preventDefault();
          climb();
        }
      });
      window.addEventListener("pointerdown", climb);

      resize();
      requestAnimationFrame(loop);
    </script>
  </body>
</html>
